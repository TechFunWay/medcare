<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在登录 · 用药管理</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #fff; background: #171827; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .card { width: min(440px,100%); padding: 36px; border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: rgba(255,255,255,.04); text-align: center; }
    .icon { width: 52px; height: 52px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 15px; color: #fff; background: linear-gradient(135deg,#6366f1,#8b5cf6); font-size: 24px; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0; color: rgba(255,255,255,.6); font-size: 14px; line-height: 1.65; }
    .error { color: #fda4af; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">✓</div>
    <h1>正在使用飞牛 NAS 登录</h1>
    <p id="status">验证当前 NAS 用户后，将自动打开 用药管理…</p>
  </main>
  <script>
  document.addEventListener('DOMContentLoaded', async function () {
    // 本页只在飞牛统一网关下可访问：网关会拦截应用自身的 Authorization
    // 凭证，所以这里只负责把网关会话换成一次性票据。两种出口：
    // 1) 常规流程：整页跳到应用直连端口，后续所有 API 都不再经过网关；
    // 2) 切换账号（?fnos_popup=1）：本页是被应用页弹出的飞牛登录窗在登录
    //    成功后的回跳目标——飞牛登录页只接受同源 redirect_uri，所以只能回
    //    到这里。取票后用 postMessage 把票据交还给打开者并自关，应用页全程
    //    不跳转。
    const base = window.location.pathname.replace(/\/fnos-entry\.html$/, '/');
    const params = new URLSearchParams(window.location.search);
    // 带上网关自身的入口地址：直连端口上的 SPA 据此记住「使用飞牛 NAS 登录」
    // 该跳到哪里，不依赖 document.referrer（从桌面图标打开时经常为空）。
    const gatewayEntry = encodeURIComponent(window.location.origin + base + 'fnos-entry.html');
    // __APP_PORT__ 由后端按实际监听端口注入。若被静态托管而未替换，绝不能拼出
    // http://主机:__APP_PORT__ 这种打不开的地址，改为就地提示。
    const servicePort = '__APP_PORT__';
    const portValid = /^[0-9]{2,5}$/.test(servicePort);
    const status = document.getElementById('status');
    function setStatus(text) {
      status.className = 'error';
      status.textContent = text;
    }
    const popupMode = params.get('fnos_popup') === '1' && !!window.opener;
    function directURL(hash) {
      return 'http://' + window.location.hostname + ':' + servicePort + base + hash;
    }
    if (!portValid) {
      if (popupMode) {
        window.opener.postMessage({ type: 'fnos_switch_error', message: '未能获取应用服务端口，请从飞牛桌面中的应用图标重新打开。' }, '*');
        setTimeout(() => window.close(), 300);
        return;
      }
      setStatus('未能获取应用服务端口，请从飞牛桌面中的应用图标重新打开。');
      return;
    }
    try {
      // 相对路径（不带前导斜杠），自动落在 /app/<包名>/ 网关前缀下。
      const response = await fetch('api/auth/fnos/ticket', { method: 'POST' });
      const data = await response.json();
      if (!response.ok || data.code !== 0 || !data.data?.ticket) {
        throw new Error(data.message || '未获取到飞牛 NAS 登录信息');
      }
      if (popupMode) {
        // 票据是一次性敏感凭证：targetOrigin 必须精确指向应用直连端口，
        // 绝不广播给其他窗口。
        window.opener.postMessage({
          type: 'fnos_switch_ticket',
          ticket: data.data.ticket,
          username: data.data.fnos_username || '',
        }, 'http://' + window.location.hostname + ':' + servicePort);
        setTimeout(() => window.close(), 200);
        return;
      }
      window.location.replace(directURL(
        '#fnos_ticket=' + encodeURIComponent(data.data.ticket) +
        '&fnos_username=' + encodeURIComponent(data.data.fnos_username || '') +
        '&fnos_gateway=' + gatewayEntry
      ));
    } catch (error) {
      if (popupMode) {
        // 失败不静默：通知打开者就地提示后自关（错误信息不含票据，可放宽来源）。
        window.opener.postMessage({
          type: 'fnos_switch_error',
          message: error.message || '切换飞牛账号失败，请重试。',
        }, '*');
        setTimeout(() => window.close(), 300);
        return;
      }
      // 失败不留空白跳板页：带错误标记回到直连端口，登录页就地提示。
      window.location.replace(directURL(
        '#fnos_error=' + encodeURIComponent(error.message || '飞牛 NAS 登录失败，请从桌面应用入口重试。') +
        '&fnos_gateway=' + gatewayEntry
      ));
    }
  });
  </script>
</body>
</html>
