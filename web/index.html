<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5b7f6b" />
    <title>用药管理</title>
    <script>
      // Apply the saved theme BEFORE any CSS or Vue mounts so the first paint
      // already reflects the user's choice — otherwise a system-default
      // light flash cuts in before Pinia's theme store runs apply().
      (function () {
        try {
          var mode = localStorage.getItem('medcare.theme_mode') || 'system';
          var brand = localStorage.getItem('medcare.theme_brand') || 'a';
          var dark = mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.add('brand-' + (['a','b','c','d','e'].indexOf(brand) >= 0 ? brand : 'a'));
        } catch (e) { /* private mode or storage off — fall back to defaults */ }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
