# 部署文件（随发行产物分发）
# 本文件由发行脚本复制到 release/<版本>/ 目录，镜像 tag 自动替换为当前版本。
#
# 用法：
#   cd release/<版本>
#   docker compose up -d
#
# 镜像说明：
#   - 本机已构建：docker load -i techfunway-medcare-v<版本>-multiarch.oci.tar
#   - 远程部署：需先将对应版本镜像推送到镜像仓库后再拉取
#
# 升级方式：
#   切换到新版本发行目录后执行 docker compose up -d；
#   数据（SQLite/上传文件/日志/配置）持久化在 named volume 中，升级不丢数据。
services:
  techfunway-medcare:
    image: techfunways/medcare:latest
    container_name: techfunway-medcare
    ports:
      - "8913:8913"
    volumes:
      - medcare-data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - ENV=release
      - DATA_DIR=/app/data
    command: ["-data-dir", "/app/data", "-web-dir", "./static/dist", "-device-type", "docker"]
    restart: unless-stopped

volumes:
  medcare-data:
