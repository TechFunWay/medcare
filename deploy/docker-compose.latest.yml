# 部署文件（latest 自动更新，随发行产物分发）
# 使用 latest 标签镜像，配合 Watchtower 自动拉取新版本并重启容器，保持始终最新。
#
# 用法：
#   cd release/<版本>
#   docker compose -f docker-compose.latest.yml up -d
#
# 镜像说明：
#   - latest 模式需要镜像可从仓库拉取；本地构建的 latest 镜像不会自动更新，
#     需先将 techfunways/medcare:latest 推送到镜像仓库
#
# Watchtower 默认每 24 小时（86400 秒）检查一次更新，仅监控 techfunway-medcare 容器，
# 更新后自动清理旧镜像。调整检查频率请修改 watchtower 的 --interval 参数（单位：秒）。
services:
  techfunway-medcare:
    image: techfunways/medcare:latest
    container_name: techfunway-medcare
    ports:
      - "8913:8913"
    volumes:
      - medcare-data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - ENV=release
      - DATA_DIR=/app/data
    command: ["-data-dir", "/app/data", "-web-dir", "./static/dist", "-device-type", "docker"]
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: techfunway-medcare-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 86400 --cleanup techfunway-medcare
    restart: unless-stopped

volumes:
  medcare-data:
